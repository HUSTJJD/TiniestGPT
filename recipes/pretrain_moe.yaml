# 稀疏 MoE 配方：总参数 ~110M，激活参数 ~40M
# 观察点：experts 的负载均衡（日志里的 aux / max_violation）
model:
  vocab_size: 2048
  dim: 512
  n_layers: 12
  n_heads: 8
  n_kv_heads: 2
  hidden_dim: 1024
  max_seq_len: 1024

  norm_type: rms
  pre_norm: true
  post_norm: true
  qk_norm: true

  rope_type: yarn
  attn_type: gqa
  attn_window: 512
  attn_sinks: 4

  moe_enabled: true
  n_experts: 8
  n_experts_per_tok: 2
  n_shared_experts: 1
  moe_score_func: sigmoid     # DeepSeek V3 式
  moe_aux_coef: 0.0           # 0 = 用 bias 动态均衡（无辅助损失）
  moe_bias_lr: 0.001
  moe_capacity_factor: 0.0

  tie_embeddings: true
  depth_scaled_init: true

data_dir: data/packed
batch_size: 8
seq_len: 512
max_steps: 2000
grad_accum_steps: 4
eval_every: 200
log_every: 20
save_every: 500

optimizer: muon
lr: 3.0e-4
muon_lr: 0.02
weight_decay: 0.1
lr_schedule: wsd
warmup_steps: 100

dtype: bf16
moe_aux_weight: 0.01
out_dir: out/moe
seed: 42
